[package]
name = "protected-pay"
version = "0.1.0"
description = "Private, reversible USDC payment workflows on MagicBlock"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "protected_pay"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
ephemeral-rollups-sdk = { workspace = true, features = ["anchor"] }
magicblock-magic-program-api = { workspace = true }
session-keys = { workspace = true, features = ["no-entrypoint"] }
solana-sha256-hasher = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
